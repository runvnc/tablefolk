<!doctype html><html><head><meta charset="utf-8"><title>tablefolk.world prop review</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b121b}canvas{width:100%;height:100%;touch-action:none}.label{position:fixed;top:18px;left:22px;color:#d9ffe7;font:16px monospace;z-index:2;text-shadow:0 2px 4px #000}</style><script src="https://cdn.babylonjs.com/babylon.js"></script><script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script></head><body><div class="label">Reference-derived props: blade cluster + daisy clump<br>drag to orbit · wheel to zoom</div><canvas id="c"></canvas><script>
(async()=>{const c=document.getElementById('c'); if(!navigator.gpu) throw new Error('WebGPU unavailable'); const e=new BABYLON.WebGPUEngine(c,{antialias:true,adaptToDeviceRatio:true}); await e.initAsync(); const s=new BABYLON.Scene(e);s.clearColor=new BABYLON.Color4(.035,.055,.08,1);const cam=new BABYLON.ArcRotateCamera('cam',-Math.PI/2,.96,5.2,new BABYLON.Vector3(0,.35,0),s);cam.attachControl(c,true);cam.lowerRadiusLimit=2;cam.upperRadiusLimit=10;const hemi=new BABYLON.HemisphericLight('fill',new BABYLON.Vector3(0,1,0),s);hemi.intensity=.9;hemi.diffuse=new BABYLON.Color3(.82,.9,1);const key=new BABYLON.DirectionalLight('key',new BABYLON.Vector3(-.7,-1,.5),s);key.intensity=2.1;key.diffuse=new BABYLON.Color3(1,.88,.72);const ground=BABYLON.MeshBuilder.CreateGround('ground',{width:8,height:5},s);const gm=new BABYLON.PBRMaterial('ground',s);gm.albedoColor=new BABYLON.Color3(.10,.13,.14);gm.roughness=1;ground.material=gm;ground.position.y=-.02;
async function add(file,x,scale){const r=await BABYLON.SceneLoader.ImportMeshAsync('','./assets/models/props/gen/',file,s);const root=r.meshes.find(m=>m.getTotalVertices&&m.getTotalVertices()>0);root.position.x=x;root.position.y=-root.getHierarchyBoundingVectors().min.y*scale;root.scaling.setAll(scale);for(const m of r.meshes){m.isPickable=false;if(m.material){m.material.environmentIntensity=.55;m.material.metallic=0;}}return root}await add('blade_cluster.glb',-1.05,1.45);await add('daisy_clump.glb',1.05,1.15);s.imageProcessingConfiguration.toneMappingEnabled=true;s.imageProcessingConfiguration.toneMappingType=BABYLON.ImageProcessingConfiguration.TONEMAPPING_KHR_PBR_NEUTRAL;s.imageProcessingConfiguration.exposure=1.28;s.imageProcessingConfiguration.contrast=1.10;e.runRenderLoop(()=>s.render());addEventListener('resize',()=>e.resize())})()
</script></body></html>
