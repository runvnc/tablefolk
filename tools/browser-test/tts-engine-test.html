<!doctype html><meta charset="utf-8"><title>TTS engine test</title>
<pre id="out">running…</pre>
<script type="module">
// Runs a speech engine's worker (?engine=pocket18-worker.js) on its own, without
// the app: loads it, speaks two lines (a preset voice), and reports what came
// back (seconds of audio, loudness, real-time factor). window.result has it.
// ?asr=1 also transcribes the audio with Whisper tiny (Transformers.js, ~40 MB)
// to check it is the words asked for. ?custom=1 then clones a voice from that
// audio (the voice encoder) and speaks with it too (result.custom).
const q = new URLSearchParams(location.search), file = q.get('engine') || 'pocket18-worker.js';
const w = new Worker('/app/tts/' + file + '?t=' + Date.now(), { type: 'module' });
const log = [], out = document.getElementById('out'), say = t => { log.push(t); out.textContent = log.join('\n'); };
const chunks = [];
let samples = 0, sumSq = 0, metrics = null, started = 0, firstAt = null;
const done = new Promise(res => { w.onmessage = e => { const m = e.data;
  if (m.type === 'status') say('status: ' + m.status);
  if (m.type === 'error') { say('ERROR: ' + m.error); res(); }
  if (m.type === 'audio_chunk') { firstAt ??= performance.now() - started; const d = new Float32Array(m.data); chunks.push(d); samples += d.length; for (const x of d) sumSq += x * x; }
  if (m.type === 'generation_metrics') metrics = m.metrics;
  if (m.type === 'stream_ended') res(); if (m.type === 'loaded') w.dispatchEvent(new Event('ready')); }; });
const t0 = performance.now();
await new Promise(r => { w.addEventListener('ready', r, { once: true }); w.postMessage({ type: 'load', data: { language: 'english_2026-04' } }); });
const loadMs = performance.now() - t0; say('loaded in ' + Math.round(loadMs) + ' ms');
const text = q.get('text') || 'Welcome, traveller. The road east is dangerous after dark, so keep your torch lit.';
started = performance.now(); w.postMessage({ type: 'generate', data: { text, voice: q.get('voice') || 'alba' } });
await done;
window.result = { loadMs: Math.round(loadMs), seconds: +(samples / 24000).toFixed(2), rms: +Math.sqrt(sumSq / Math.max(1, samples)).toFixed(4), firstAudioMs: Math.round(firstAt), metrics };
if (q.has('asr')) {
  const all = new Float32Array(samples); let o = 0; for (const c of chunks) { all.set(c, o); o += c.length; }
  const n = Math.floor(all.length * 16000 / 24000), pcm = new Float32Array(n);
  for (let i = 0; i < n; i++) { const p = i * 1.5, j = Math.floor(p), f = p - j; pcm[i] = all[j] * (1 - f) + (all[j + 1] || 0) * f; }
  say('transcribing…');
  const { pipeline } = await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.1');
  const asr = await pipeline('automatic-speech-recognition', 'onnx-community/whisper-tiny.en', { device: 'wasm', dtype: 'q8' });
  window.result.heard = (await asr(pcm)).text.trim();
}
if (q.has('custom')) {
  const all = new Float32Array(samples); let o = 0; for (const c of chunks) { all.set(c, o); o += c.length; }
  const before = chunks.length; samples = 0; sumSq = 0; chunks.length = 0; metrics = null;
  const d2 = new Promise(res => w.addEventListener('message', e => { if (e.data.type === 'stream_ended' || e.data.type === 'error') res(e.data.error); }));
  w.postMessage({ type: 'encode_voice', data: { voiceId: 'clone', audio: all } });
  const t1 = performance.now(); started = t1; firstAt = null;
  w.postMessage({ type: 'generate', data: { text: 'This is my own voice now.', voice: 'custom:clone' } });
  const err = await d2;
  window.result.custom = { error: err || null, seconds: +(samples / 24000).toFixed(2), rms: +Math.sqrt(sumSq / Math.max(1, samples)).toFixed(4), ms: Math.round(performance.now() - t1) };
}
say(JSON.stringify(window.result));
</script>
