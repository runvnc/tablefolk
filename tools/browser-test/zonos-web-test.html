<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZONOS3-Mini test</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f5f2; --fg: #1d1d1b; --muted: #6b6a66; --line: #d9d6cf; }
  @media (prefers-color-scheme: dark) { :root { --bg: #171716; --fg: #ecebe7; --muted: #9a9892; --line: #383734; } }
  body { background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; margin: 0; padding: 24px 16px; }
  main { max-width: 760px; margin: 0 auto; }
  textarea, select { width: 100%; box-sizing: border-box; font: inherit; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: inherit; }
  button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--fg); color: var(--bg); cursor: pointer; margin-top: 8px; }
  pre { white-space: pre-wrap; font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
</style>
</head>
<body>
<main>
  <h1>ZONOS3-Mini in this browser</h1>
  <p>Runs <code>libs/voice/zonos-web-worker.js</code> alone: the first run downloads about 1 GB from Hugging Face. Voice: a built-in name (savannah, rupert…), a Pocket name (alba, jean…), or a library sample path (assets/voices/…) to clone. <code>window.zt</code> is the test API (zonos-web-test.mjs).</p>
  <textarea id="text" rows="3">Well met, traveller. The road north is muddy after the rain, but the inn at the crossing still has a warm fire and a free bed.</textarea>
  <input id="voice" value="savannah">
  <button id="run">Speak</button>
  <audio id="audio" controls hidden></audio>
  <pre id="log"></pre>
</main>
<script type="module">
const $ = id => document.getElementById(id);
const log = s => { $('log').textContent += s + '\n'; console.log(s); };
const w = new Worker('/libs/voice/zonos-web-worker.js', { type: 'module' });
let wait = null, chunks = [], metrics = null;
w.onmessage = e => {
  const m = e.data || {};
  if (m.type === 'status') log('status: ' + m.status);
  else if (m.type === 'runtime_info') log('backend: ' + m.data.backend);
  else if (m.type === 'audio_chunk') chunks.push(new Float32Array(m.data));
  else if (m.type === 'generation_metrics') metrics = m.metrics;
  else if (m.type === 'error') { log('error: ' + m.error); wait?.reject(new Error(m.error)); wait = null; }
  if (wait && wait.on.includes(m.type)) { const x = wait; wait = null; x.resolve(m); }
};
const step = (msg, on) => new Promise((resolve, reject) => { wait = { resolve, reject, on }; w.postMessage(msg); });
function wav(pcm, rate) {
  const b = new ArrayBuffer(44 + pcm.length * 2), v = new DataView(b), s = (o, t) => [...t].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  s(0, 'RIFF'); v.setUint32(4, 36 + pcm.length * 2, true); s(8, 'WAVE'); s(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); s(36, 'data'); v.setUint32(40, pcm.length * 2, true);
  for (let i = 0; i < pcm.length; i++) v.setInt16(44 + i * 2, Math.max(-1, Math.min(1, pcm[i])) * 32767, true);
  return b;
}
const b64 = buf => { const u = new Uint8Array(buf); let t = ''; for (let i = 0; i < u.length; i += 32768) t += String.fromCharCode.apply(null, u.subarray(i, i + 32768)); return btoa(t); };
let loaded = null;
window.zt = {
  options: o => w.postMessage({ type: 'set_options', data: o }),
  load: () => loaded ||= step({ type: 'load', data: {} }, ['loaded']).then(m => m.loadMs),
  // a library sample cloned into voiceId (its embedding comes back)
  async clone(voiceId, url) {
    await this.load();
    const dec = await new OfflineAudioContext(1, 1, 24000).decodeAudioData(await (await fetch(url)).arrayBuffer());
    const audio = dec.getChannelData(0).slice();
    await step({ type: 'encode_voice', data: { voiceId, audio } }, ['voice_encoded']);
    return (await step({ type: 'get_embedding', data: { voiceId } }, ['embedding'])).embedding;
  },
  async say(text, voice) {
    await this.load(); chunks = []; metrics = null;
    await step({ type: 'generate', data: { text, voice } }, ['stream_ended']);
    const n = chunks.reduce((t, c) => t + c.length, 0), pcm = new Float32Array(n); let o = 0; for (const c of chunks) { pcm.set(c, o); o += c.length; }
    let peak = 0; for (const x of pcm) peak = Math.max(peak, Math.abs(x));
    const f = wav(pcm, 24000); $('audio').src = URL.createObjectURL(new Blob([f], { type: 'audio/wav' })); $('audio').hidden = false;
    return { ...metrics, peak, wav: b64(f) };
  },
};
$('run').onclick = async () => {
  let v = $('voice').value.trim();
  try {
    if (v.includes('/')) { await zt.clone('sample', v); v = 'custom:sample'; }
    const r = await zt.say($('text').value, v); delete r.wav; log(JSON.stringify(r));
  } catch (e) { log('error: ' + e.message); }
};
</script>
</body>
</html>
